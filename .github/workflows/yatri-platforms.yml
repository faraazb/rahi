# Builds the platforms layer from the Yatri app: fetch the APK from Google Play,
# extract its database, match platforms and door sides onto our timetable, and
# report coverage.
#
# LOCAL ONLY for now. Yatri's data may not be redistributed until CDP India /
# Central Railway agree, so this workflow:
#   - runs only by hand (no schedule yet; add one when publishing is agreed);
#   - uploads NOTHING: no artifacts (anyone signed in to GitHub can download
#     a public repo's artifacts) and no actions/cache (pull requests from forks
#     can restore the default branch's caches). The APK is fetched fresh on each
#     run and everything is discarded with the runner;
#   - writes only aggregate counts to the job summary.
# The `publish` input marks where publishing will go; it refuses to run today.
#
# Google Play login, from repository secrets (see pipeline/tools/yatri_fetch.py):
#   GOOGLE_EMAIL + GOOGLE_AAS_TOKEN        your own account, or
#   DISPENSER_URL + DISPENSER_USER_AGENT   a token dispenser such as Aurora's.
# GitHub runners share datacenter IPs, so Google Play and dispensers rate-limit
# them more often than a home connection; the fetch retries with backoff and
# the run fails cleanly (exit 3) when login is impossible.

name: Yatri platforms (local only)

on:
  workflow_dispatch:
    inputs:
      wr_release:
        description: WR timetable folder under data/raw/wr/ to match against
        default: "2026-09-01"
        required: true
      publish:
        description: Publish the platforms layer (not approved yet; leave off)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: yatri-platforms
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Refuse to publish
        if: ${{ inputs.publish }}
        run: |
          echo "::error::Publishing Yatri's platforms is not approved yet (see docs/observations.md). Nothing was run."
          exit 1

      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true # tool binaries only (python, uv, node, apkeep), never data

      - name: Parse the WR timetable
        run: mise run wr -- "data/raw/wr/${{ inputs.wr_release }}"

      - name: Fetch Yatri and extract its database
        env:
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL }}
          GOOGLE_AAS_TOKEN: ${{ secrets.GOOGLE_AAS_TOKEN }}
          DISPENSER_URL: ${{ secrets.DISPENSER_URL }}
          DISPENSER_USER_AGENT: ${{ secrets.DISPENSER_USER_AGENT }}
        run: |
          set +e
          mise run yatri -- --attempts 4
          code=$?
          if [ "$code" = 3 ]; then
            echo "::error::Google Play login failed (dispenser down or rate-limited, or the account token is invalid). Try again later."
          fi
          exit $code

      - name: Match platforms (gated)
        run: mise run platforms

      - name: Summary
        if: always()
        run: |
          stats=pipeline/build/platforms.stats.json
          [ -f "$stats" ] || { echo "No platforms stats were produced." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          python3 - "$stats" temp.fignore/yatri/yatri.json >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          import json, sys
          s = json.load(open(sys.argv[1]))
          try:
              y = json.load(open(sys.argv[2]))
          except OSError:
              y = {}
          print("## Yatri platforms (local only, not published)\n")
          print(f"- Yatri version: {y.get('version') or 'unknown'}; data updated {y.get('data_updated_at') or 'unknown'}")
          print(f"- Stops with a platform: {s['matched']:,} of {s['stops']:,} ({s['coverage']:.1%})")
          print(f"- Missing: no platform in Yatri {s['no_platform']:,}, time differs {s['time_mismatch']:,}, "
                f"stop not in Yatri {s['no_stop']:,}, train not in Yatri {s['no_train']:,}")
          print(f"- Door side shown on {s['door_side_set']:,} stops; "
                f"{s['door_side_conflicting_groups']} of {s['door_side_groups']} platform groups disagree")
          print("- Weakest stations: " + ", ".join(f"{c} {r:.0%}" for c, r, n in s["weakest_stations"][:6]))
          EOF
