# Builds the timetable database from the newest snapshots, tries to add Yatri's
# platforms, door sides and rake links to it, and packages a release.
#
# Started by the timetable watcher (watch/publish.sh) on the watch/<railway>
# branch whenever it pushes a new snapshot, or by hand.
#
# Whether Yatri's layers go into the release is decided by the variable
# MERGE_YATRI_PLATFORMS in the "Act" environment (Settings -> Environments -> Act
# -> Environment variables). Yatri's data may not be redistributed until CDP
# India / Central Railway agree, so:
#   - unset or anything but "true": the release holds official data only. Yatri
#     is still fetched and matched, but only aggregate counts leave the runner
#     (job summary and PR comment); its tables are discarded with the runner.
#   - "true": the release carries the platform and rake_next tables
#     (manifest layers marked local_only: false).
# A Yatri failure (login, download, or the platforms gate) never fails the run:
# the release then holds official data only and the summary says why.
#
# The release folder is uploaded as a workflow artifact. Publishing it to a
# GitHub Release / Pages is not wired up yet.
#
# Google Play login, from secrets in the "Act" environment (see pipeline/tools/yatri_fetch.py):
#   GOOGLE_EMAIL + GOOGLE_AAS_TOKEN        your own account (also read as EMAIL + AAS_TOKEN), or
#   DISPENSER_URL + DISPENSER_USER_AGENT   a token dispenser such as Aurora's.
# GitHub runners share datacenter IPs, so Google Play and dispensers rate-limit
# them more often than a home connection; the fetch retries with backoff.

name: Yatri platforms

on:
  workflow_dispatch:
    inputs:
      wr:
        description: WR folder under data/raw/wr/ (default the newest)
        required: false
      cr:
        description: CR folder under data/raw/cr/ (default the newest)
        required: false
      ntes:
        description: NTES folder under data/raw/ntes/ (default the newest)
        required: false

permissions:
  contents: read
  pull-requests: write # summary comment on the watcher's PR

concurrency:
  group: yatri-platforms-${{ github.ref }}
  cancel-in-progress: true # a newer snapshot on the same branch supersedes this run

jobs:
  build:
    runs-on: ubuntu-latest
    environment: Act # Google Play secrets and the MERGE_YATRI_PLATFORMS switch
    timeout-minutes: 45
    env:
      MERGE: ${{ vars.MERGE_YATRI_PLATFORMS == 'true' }}
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true # tool binaries only (python, uv, node, apkeep), never data

      - name: Pick snapshots
        id: snap
        env:
          IN_WR: ${{ inputs.wr }}
          IN_CR: ${{ inputs.cr }}
          IN_NTES: ${{ inputs.ntes }}
        run: |
          pick() { # <railway> <input>: the given folder, else the newest dated one
            if [ -n "$2" ]; then echo "data/raw/$1/$2"
            else ls -d data/raw/"$1"/*/ 2>/dev/null | sort | tail -n1 | sed 's:/$::'; fi
          }
          wr=$(pick wr "$IN_WR"); cr=$(pick cr "$IN_CR"); ntes=$(pick ntes "$IN_NTES")
          for d in "$wr" "$cr"; do [ -d "$d" ] || { echo "::error::missing snapshot folder '$d'"; exit 1; }; done
          echo "wr=$wr" >> "$GITHUB_OUTPUT"; echo "cr=$cr" >> "$GITHUB_OUTPUT"; echo "ntes=$ntes" >> "$GITHUB_OUTPUT"
          echo "Snapshots: WR $wr, CR $cr, NTES ${ntes:-none}"

      - name: Build the official database
        run: |
          ntes_arg=()
          [ -n "${{ steps.snap.outputs.ntes }}" ] && ntes_arg=(--ntes "${{ steps.snap.outputs.ntes }}")
          mise run build -- --wr "${{ steps.snap.outputs.wr }}" --cr "${{ steps.snap.outputs.cr }}" "${ntes_arg[@]}"
          cp pipeline/build/mumbai-local.sqlite pipeline/build/official.sqlite

      - name: Fetch Yatri and extract its database
        id: yatri
        continue-on-error: true
        env:
          GOOGLE_EMAIL: ${{ secrets.GOOGLE_EMAIL || secrets.EMAIL || vars.GOOGLE_EMAIL }}
          GOOGLE_AAS_TOKEN: ${{ secrets.GOOGLE_AAS_TOKEN || secrets.AAS_TOKEN }}
          DISPENSER_URL: ${{ secrets.DISPENSER_URL }}
          DISPENSER_USER_AGENT: ${{ secrets.DISPENSER_USER_AGENT }}
        run: |
          set +e
          mise run yatri -- --attempts 4
          code=$?
          if [ "$code" = 3 ]; then
            echo "::warning::Google Play login failed (dispenser down or rate-limited, or the account token is invalid)."
          fi
          exit $code

      - name: Match platforms (gated)
        id: platforms
        if: steps.yatri.outcome == 'success'
        continue-on-error: true
        run: mise run platforms

      - name: Package the release
        id: release
        run: |
          if [ "$MERGE" = true ] && [ "${{ steps.platforms.outcome }}" = success ]; then
            db=pipeline/build/mumbai-local.sqlite; flags=(--merge-layers); merged=true
          else
            db=pipeline/build/official.sqlite; flags=(); merged=false
            if [ "$MERGE" = true ]; then
              echo "::warning::MERGE_YATRI_PLATFORMS is true but Yatri's layers were not built; releasing official data only."
            fi
          fi
          rm -rf pipeline/build/releases
          uv run --project pipeline mumbailocal release --db "$db" --out pipeline/build/releases "${flags[@]}"
          echo "dir=$(ls -d pipeline/build/releases/*/)" >> "$GITHUB_OUTPUT"
          echo "tag=$(basename "$(ls -d pipeline/build/releases/*/)")" >> "$GITHUB_OUTPUT"
          echo "merged=$merged" >> "$GITHUB_OUTPUT"

      - name: Upload the release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.release.outputs.tag }}
          path: ${{ steps.release.outputs.dir }}
          retention-days: 30

      - name: Summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          YATRI: ${{ steps.yatri.outcome }}
          PLATFORMS: ${{ steps.platforms.outcome }}
          TAG: ${{ steps.release.outputs.tag }}
          MERGED: ${{ steps.release.outputs.merged }}
          SNAPSHOTS: "WR ${{ steps.snap.outputs.wr }}, CR ${{ steps.snap.outputs.cr }}, NTES ${{ steps.snap.outputs.ntes || 'none' }}"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          out="$RUNNER_TEMP/summary.md"
          python3 - pipeline/build/platforms.stats.json temp.fignore/yatri/yatri.json > "$out" <<'EOF'
          import json, os, sys
          env = os.environ.get
          print("## Timetable build\n")
          print(f"- Snapshots: {env('SNAPSHOTS')}")
          if env("TAG"):
              merged = env("MERGED") == "true"
              what = "official data + Yatri platforms and rake links" if merged else "official data only"
              print(f"- Release `{env('TAG')}`: {what} ([run and artifact]({env('RUN_URL')}))")
          else:
              print(f"- No release was built ([run]({env('RUN_URL')}))")
          print(f"- MERGE_YATRI_PLATFORMS: {env('MERGE')}")
          print(f"- Yatri fetch: {env('YATRI') or 'not run'}; platforms gate: {env('PLATFORMS') or 'not run'}")
          try:
              s = json.load(open(sys.argv[1]))
          except OSError:
              sys.exit(0)
          try:
              y = json.load(open(sys.argv[2]))
          except OSError:
              y = {}
          print("\n### Yatri match\n")
          print(f"- Yatri version: {y.get('version') or 'unknown'}; data updated {y.get('data_updated_at') or 'unknown'}")
          print(f"- Stops with a platform: {s['matched']:,} of {s['stops']:,} ({s['coverage']:.1%})")
          print(f"- Missing: no platform in Yatri {s['no_platform']:,}, time differs {s['time_mismatch']:,}, "
                f"stop not in Yatri {s['no_stop']:,}, train not in Yatri {s['no_train']:,}")
          print(f"- Door side shown on {s['door_side_set']:,} stops; "
                f"{s['door_side_conflicting_groups']} of {s['door_side_groups']} platform groups disagree")
          print("- Weakest stations: " + ", ".join(f"{c} {r:.0%}" for c, r, n in s["weakest_stations"][:6]))
          EOF
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
          pr=$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then gh pr comment "$pr" --body-file "$out" >/dev/null && echo "Commented on PR #$pr"; fi
